<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Food Ordering{% endblock %} | BPM System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* sliding pill */
    .slide-pill {
      position: absolute; top: 0; left: 0; width: 0; height: 0; z-index: 0;
      border-radius: 999px; pointer-events: none;
      transition: transform .4s cubic-bezier(.34,1.25,.5,1), width .4s cubic-bezier(.34,1.25,.5,1), height .4s cubic-bezier(.34,1.25,.5,1);
    }

    /* top nav */
    .topbar nav { position: relative; }
    .topbar nav a { position: relative; z-index: 1; background: transparent !important; box-shadow: none !important; }
    .topbar nav .slide-pill { background: #f4f6f1; box-shadow: 0 1px 4px rgba(38,48,41,.14); }

    /* order tabs and payment methods */
    .tabs, .pay-methods { position: relative; }
    .tabs .slide-pill, .pay-methods .slide-pill { background: #648a6d; box-shadow: 0 4px 12px rgba(100,138,109,.28); }
    .tabs .tab { position: relative; z-index: 1; background: transparent !important; box-shadow: inset 0 0 0 1.5px #d0d7cd !important; }
    .tabs .tab.active { color: #fff; box-shadow: none !important; }
    .pay-methods .pill span { position: relative; z-index: 1; background: transparent !important; }
    .pay-methods .pill input:checked + span { color: #fff; box-shadow: none !important; }
  </style>
</head>
<body>
  <header class="topbar no-print">
    <a class="brand" href="{{ url_for('pos') }}">
      <span class="brand-mark"></span>
      <span class="brand-text">Simple Business Process Management System<small>Online Food Ordering Process</small></span>
    </a>
    <nav>
      <a href="{{ url_for('pos') }}" class="{% if request.endpoint == 'pos' %}active{% endif %}">Take Order</a>
      <a href="{{ url_for('all_orders') }}" class="{% if request.endpoint in ('all_orders', 'view_order') %}active{% endif %}">Orders</a>
    </nav>
  </header>

  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="msg {{ category }} no-print">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script>
  (function () {
    // function for getting an element's position and size
    function rect(el) {
      return { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
    }

    // function for creating a sliding pill inside a box
    function slider(box, current, key) {
      var s = document.createElement('span');
      s.className = 'slide-pill';
      box.prepend(s);

      // function for moving the pill
      function put(r, animate) {
        s.style.transition = animate ? '' : 'none';
        s.style.width = r.w + 'px';
        s.style.height = r.h + 'px';
        s.style.transform = 'translate(' + r.x + 'px,' + r.y + 'px)';
      }

      var el = current();
      if (el) {
        var old = key && sessionStorage.getItem(key);
        if (old) {
          sessionStorage.removeItem(key);
          put(JSON.parse(old), false);
          void s.offsetWidth;
          requestAnimationFrame(function () { put(rect(el), true); });
        } else {
          put(rect(el), false);
        }
      }

      // reposition on resize
      window.addEventListener('resize', function () {
        var c = current();
        if (c) put(rect(c), false);
      });
      return put;
    }

    // function for link groups (nav and order tabs)
    function links(box, key) {
      var cur = function () { return box.querySelector('a.active'); };
      slider(box, cur, key);
      box.addEventListener('click', function (e) {
        if (e.target.closest('a') && cur()) sessionStorage.setItem(key, JSON.stringify(rect(cur())));
      });
    }

    // setup on page load
    window.addEventListener('load', function () {
      var nav = document.querySelector('.topbar nav');
      var tabs = document.querySelector('.tabs');
      if (nav) links(nav, 'pill-nav');
      if (tabs) links(tabs, 'pill-tabs');

      // payment method pills
      document.querySelectorAll('.pay-methods').forEach(function (box) {
        var cur = function () {
          var r = box.querySelector('input:checked');
          return r && r.nextElementSibling;
        };
        var put = slider(box, cur);
        box.addEventListener('change', function () { put(rect(cur()), true); });
      });
    });
  })();
  </script>
</body>
</html>
